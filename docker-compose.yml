version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: src/OpenNet.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Database__Provider=postgres
      - Database__ConnectionString=Host=db;Database=opennet;Username=opennet;Password=opennet
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: opennet
      POSTGRES_USER: opennet
      POSTGRES_PASSWORD: opennet
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
